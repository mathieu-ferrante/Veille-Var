name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Qualité et sécurité du code (ruff)
        run: ruff check .
      - name: Tests automatisés (sans appel réel au service d'IA)
        run: pytest -v
