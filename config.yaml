# Configuration de VeilleIA – Département du Var (scénario prospectif)
# Les secrets (clés API) ne sont PAS ici : ils sont lus dans le fichier .env.

# ---------------------------------------------------------------------------
# Fournisseurs de services d'IA
# Tous sont appelés via l'interface « chat completions » compatible OpenAI,
# ce qui permet d'utiliser un seul connecteur et de comparer les services
# dans des conditions identiques (benchmark).
#   prix entree / sortie : par million de tokens, relevés le 06/11/2026 sur la page tarifs
#      officielle (en dollars US, hors taxes). Convertis à 1 $ = 1 € : c'est un majorant prudent
#      (le dollar vaut moins d'un euro), le coût réel est donc un peu inférieur au coût calculé.
#      null = prix non publié : le coût n'est alors pas calculé.
#   modeles : à vérifier dans la documentation, les noms évoluent.
# ---------------------------------------------------------------------------
fournisseurs:
  mistral:
    libelle: "Mistral AI – La Plateforme"
    # Point d'accès régional : l'inférence est garantie dans l'UE/AELE
    # (https://docs.mistral.ai/inference/regional-inference, testé le 06/11/2026).
    base_url: "https://api.eu.mistral.ai/v1"
    cle_env: MISTRAL_API_KEY
    json_mode: true
    modeles:
      # Plan gratuit « Experiment » : quota nul sur mistral-small et mistral-medium
      # (x-ratelimit-limit-req-minute = 0, vérifié le 05/11/2026). Modèles autorisés :
      # ministral-8b (188 req/min) et mistral-large-4 (50 req/min, 20 000 tokens/min).
      petit: "ministral-8b-latest"
      grand: "mistral-large-4"
    prix:   # https://docs.mistral.ai/inference/pricing
      ministral-8b-latest: { entree: 0.15, sortie: 0.15 }
      mistral-large-4: { entree: 0.70, sortie: 2.10 }

  albert:
    libelle: "Albert API (DINUM)"
    base_url: "https://albert.api.etalab.gouv.fr/v1"
    cle_env: ALBERT_API_KEY
    json_mode: true
    # Gratuit, mais accès sur demande (priorité aux services de l'État). Catalogue au 06/11/2026 :
    # https://ia.numerique.gouv.fr/outils-ia/albert-api/tarifs-et-limites (identifiants exacts à
    # confirmer avec GET /v1/models une fois l'accès obtenu).
    modeles:
      petit: "Ministral-3-8B-Instruct-2512"
      grand: "Mistral-Small-3.2-24B"
    prix:
      Ministral-3-8B-Instruct-2512: { entree: 0, sortie: 0 }
      Mistral-Small-3.2-24B: { entree: 0, sortie: 0 }

  openai:
    libelle: "OpenAI API"
    base_url: "https://api.openai.com/v1"
    cle_env: OPENAI_API_KEY
    json_mode: true
    # Les modèles de raisonnement GPT-5 imposent ces deux réglages
    parametre_max_tokens: max_completion_tokens
    temperature_supportee: false
    modeles:
      petit: "gpt-5.4-mini"
      grand: "gpt-5.4-mini"
    prix:   # https://developers.openai.com/api/docs/pricing
      gpt-5.4-mini: { entree: 0.75, sortie: 4.50 }

  gemini:
    libelle: "Google Gemini API"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    cle_env: GEMINI_API_KEY
    json_mode: true
    # Offre gratuite : nombre de requêtes par minute limité (HTTP 429 « quota exceeded » au-delà,
    # constaté le 06/11/2026 sur le benchmark : 7 refus sur 30). Valeur prudente ; limites à jour
    # sur https://ai.dev/rate-limit.
    requetes_par_minute: 10
    modeles:
      # gemini-2.5-* n'est plus ouvert aux nouveaux comptes (HTTP 404, vérifié le 05/11/2026).
      # 3.7/3.8-flash saturés (HTTP 503 / délai dépassé) ; « pro » sans quota gratuit.
      petit: "gemini-3.5-flash-lite"
      grand: "gemini-3.5-flash"
    prix:   # https://aistudio.google.com/docs/pricing (gemini-3.5-flash n'y figure plus)
      gemini-3.5-flash-lite: { entree: 0.30, sortie: 2.50 }

  anthropic:
    libelle: "Anthropic Claude API"
    base_url: "https://api.anthropic.com/v1"
    cle_env: ANTHROPIC_API_KEY
    json_mode: false   # le JSON est imposé par le prompt puis validé
    modeles:
      petit: "claude-haiku-5-5"
      grand: "claude-sonnet-5-5"
    prix:   # https://claude.com/pricing (Haiku : tarif jusqu'à 100 000 tokens de prompt)
      claude-haiku-5-5: { entree: 0.10, sortie: 0.50 }
      claude-sonnet-5-5: { entree: 2.00, sortie: 10.00 }

  ollama:
    libelle: "Modèle local (Ollama)"
    base_url_env: OLLAMA_BASE_URL
    base_url: "http://localhost:11434/v1"
    cle_env: null      # pas d'authentification en local
    json_mode: true
    # Choix par essai sur le jeu de test (06/11/2026, GPU Radeon RX 6750 XT 12 Go) :
    #   llama3.2:3b  -> note 5/5 à 27 publications sur 30 (écart pertinence 2,55) : inutilisable
    #   mistral-nemo -> classement 60 %, écart 0,93
    #   gemma3:12b   -> classement 73,3 %, écart 0,97 : retenu
    modeles:
      petit: "gemma3:12b"
      grand: "gemma3:12b"
    prix:   # exécution locale : pas de facturation à l'appel (coût = matériel + électricité)
      gemma3:12b: { entree: 0, sortie: 0 }

# ---------------------------------------------------------------------------
# Paramétrage du service retenu (C8)
# ---------------------------------------------------------------------------
production:
  fournisseur: mistral          # service recommandé par le benchmark (score 4,55/5, voir benchmark/README.md)
  modele_analyse: petit         # tri / notation / résumé (F1 à F4) : petit modèle = sobriété
  modele_synthese: grand        # synthèse hebdomadaire (F5)
  temperature: 0.1              # faible : réponses stables et factuelles
  max_tokens_analyse: 400
  # mistral-large-4 raisonne avant de répondre : le raisonnement compte dans ce plafond.
  # Mesures du 06/11/2026 : 2 500 -> réponse vide ; 8 000 -> JSON coupé (25 articles).
  max_tokens_synthese: 16000
  # La synthèse par mistral-large-4 dure environ 1 min (56 s mesurées le 06/11/2026) :
  # 60 s laissait trop peu de marge, une coupure relançait tout l'appel.
  timeout_s: 180
  tentatives: 3                 # nouvelles tentatives sur erreur 429 / 5xx / réseau
  pause_entre_appels_s: 0.5     # respect des limites de débit

# ---------------------------------------------------------------------------
# Collecte
# ---------------------------------------------------------------------------
collecte:
  fichier_sources: sources.yaml
  jours_max: 8                  # on ignore les publications plus anciennes
  max_par_source: 30            # plafond par flux et par collecte
  taille_max_contenu: 2500      # caractères envoyés au modèle (sobriété)
  timeout_s: 20
  user_agent: "VeilleIA/0.1 (outil de veille interne)"

# ---------------------------------------------------------------------------
# Analyse et synthèse
# ---------------------------------------------------------------------------
themes_collectivite: |
  Département (collectivité territoriale française) : action sociale, collèges,
  routes, services numériques aux usagers, DSI. Sujets suivis : AI Act et
  obligations des administrations, RGPD et IA, recommandations CNIL, sécurité
  des SI, IA générative et offres souveraines pour le secteur public,
  modèles open-weight, sobriété numérique.

synthese:
  pertinence_min: 3             # seuls les articles notés >= 3/5 entrent dans la synthèse
  max_articles: 25
  dossier_sortie: syntheses
  relecteur: "Mathieu Ferrante"  # agent qui relit la synthèse avant diffusion

base_de_donnees: data/veilleia.db

# ---------------------------------------------------------------------------
# Monitorage : seuils d'alerte
# ---------------------------------------------------------------------------
monitorage:
  fenetre_jours: 7
  seuils:
    taux_erreur_max: 0.05       # > 5 % d'appels en échec
    latence_p95_max_s: 15       # 95e centile de latence
    json_invalide_max: 0.05     # > 5 % de réponses non conformes au schéma
    cout_hebdo_max_eur: 7.5     # ≈ 30 €/mois
    tokens_hebdo_max: 2000000
    sources_en_erreur_max: 2    # flux RSS injoignables lors d'une collecte
  dossier_sortie: sorties/monitoring
