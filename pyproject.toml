[project]
name = "veilleia"
version = "0.1.0"
description = "Veille technique et réglementaire sur l'IA, automatisée par un service d'IA – Département du Var (scénario prospectif)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
veilleia = "veilleia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veilleia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:To avoid breaking existing software:DeprecationWarning:feedparser"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Gabarits HTML : lignes longues assumées pour garder le balisage lisible
"veilleia/monitoring.py" = ["E501"]
"veilleia/synthese.py" = ["E501"]
